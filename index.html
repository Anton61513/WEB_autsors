<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портал Управления — Авторизация и Кабинеты</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col antialiased transition-colors duration-200">

  <!-- TOP HEADER -->
  <header id="appHeader" class="bg-slate-900 border-b dark:border-slate-800 text-white shadow-md sticky top-0 z-30 hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold flex items-center justify-center w-10 h-10 shadow">
          <i class="fa-solid fa-users-gear text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight">Портал Управления</h1>
          <p id="headerRoleBadge" class="text-xs text-indigo-300 font-medium">Роль: Менеджер</p>
        </div>
      </div>
      <div class="flex items-center space-x-3 sm:space-x-4">
        <button onclick="toggleTheme()" class="p-2 bg-slate-800 hover:bg-slate-700 text-amber-400 rounded-lg border border-slate-700 transition">
          <i class="fa-solid fa-sun dark:hidden"></i>
          <i class="fa-solid fa-moon hidden dark:block text-indigo-300"></i>
        </button>
        <button onclick="logout()" class="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 rounded-lg text-xs font-medium transition flex items-center space-x-1.5">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Выйти</span>
        </button>
      </div>
    </div>
  </header>

  <!-- AUTH SCREEN -->
  <section id="authScreen" class="flex-1 flex flex-col items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 max-w-md w-full p-6 sm:p-8">
      
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg text-2xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Добро пожаловать</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Войдите в аккаунт или пройдите регистрацию</p>
      </div>

      <!-- Tabs Switcher -->
      <div class="bg-slate-100 dark:bg-slate-800 p-1 rounded-xl flex mb-6 text-sm font-medium">
        <button id="btnAuthLogin" onclick="setAuthMode('login')" class="flex-1 py-2 rounded-lg text-center transition-all bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 shadow-sm font-semibold">Вход</button>
        <button id="btnAuthRegister" onclick="setAuthMode('register')" class="flex-1 py-2 rounded-lg text-center transition-all text-slate-600 dark:text-slate-400 hover:text-white">Регистрация</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Выберите роль</label>
          <select id="loginRole" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
            <option value="manager">Менеджер</option>
            <option value="admin">Администратор</option>
            <option value="outsource">Аутсорс</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Номер телефона</label>
          <input type="text" id="loginPhone" required value="+380671354296" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Пароль</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition shadow-lg">Войти в аккаунт</button>
      </form>

      <!-- REGISTRATION FORM -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Роль при регистрации</label>
          <select id="regRole" onchange="toggleRegFields()" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
            <option value="manager">Менеджер</option>
            <option value="admin">Администратор</option>
            <option value="outsource">Аутсорс</option>
          </select>
        </div>

        <!-- Код доступа (только для Менеджера и Админа) -->
        <div id="accessCodeContainer">
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Код доступа *</label>
          <input type="password" id="regAccessCode" placeholder="Введите код доступа" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Фамилия *</label>
            <input type="text" id="regLastName" required placeholder="Ганчин" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Имя *</label>
            <input type="text" id="regFirstName" required placeholder="Антоний" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Номер телефона *</label>
          <input type="tel" id="regPhone" required value="+380671354296" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1">Создайте пароль *</label>
          <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-3 py-2.5 border border-slate-300 dark:border-slate-700 rounded-lg text-sm bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 focus:outline-none">
        </div>

        <!-- Желтая рамка выводится ТОЛЬКО при выборе Аутсорса -->
        <div id="outsourceNotice" class="p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 rounded-lg text-xs text-amber-800 dark:text-amber-200 leading-relaxed hidden">
          <i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i>
          Для регистрации Аутсорс-сотрудника менеджер должен заранее внести ваши данные в список доступа.
        </div>

        <div id="authErrorMsg" class="text-xs text-rose-500 font-medium hidden"></div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition shadow-lg">Зарегистрироваться</button>
      </form>

    </div>
  </section>

  <!-- MANAGER DASHBOARD -->
  <main id="managerScreen" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 hidden">
    <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm">
      <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Кабинет Менеджера</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400">Интерфейс управления складами Украины и сотрудниками.</p>
    </div>
  </main>

  <script>
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    function setAuthMode(mode) {
      const isLogin = mode === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      document.getElementById('btnAuthLogin').className = isLogin ? 'flex-1 py-2 rounded-lg text-center transition-all bg-white dark:bg-slate-700 text-indigo-600 shadow-sm font-semibold' : 'flex-1 py-2 rounded-lg text-center transition-all text-slate-400';
      document.getElementById('btnAuthRegister').className = !isLogin ? 'flex-1 py-2 rounded-lg text-center transition-all bg-white dark:bg-slate-700 text-indigo-600 shadow-sm font-semibold' : 'flex-1 py-2 rounded-lg text-center transition-all text-slate-400';
      document.getElementById('authErrorMsg').classList.add('hidden');
    }

    function toggleRegFields() {
      const role = document.getElementById('regRole').value;
      const accessCodeContainer = document.getElementById('accessCodeContainer');
      const outsourceNotice = document.getElementById('outsourceNotice');

      if (role === 'outsource') {
        accessCodeContainer.classList.add('hidden'); // Аутсорсу код не нужен
        outsourceNotice.classList.remove('hidden');  // Показываем желтую рамку
      } else {
        accessCodeContainer.classList.remove('hidden'); // Менеджеру и Админу нужен код
        outsourceNotice.classList.add('hidden');    // Скрываем желтую рамку
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appHeader').classList.remove('hidden');
      document.getElementById('managerScreen').classList.remove('hidden');
    }

    function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('regRole').value;
      const code = document.getElementById('regAccessCode').value.trim();
      const errBox = document.getElementById('authErrorMsg');
      errBox.classList.add('hidden');

      if (role === 'manager' && code !== '111') {
        errBox.textContent = 'Неверный код доступа для Менеджера (нужен 111)';
        errBox.classList.remove('hidden');
        return;
      }
      if (role === 'admin' && code !== '222') {
        errBox.textContent = 'Неверный код доступа для Администратора (нужен 222)';
        errBox.classList.remove('hidden');
        return;
      }

      // Успешно
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appHeader').classList.remove('hidden');
      document.getElementById('managerScreen').classList.remove('hidden');
    }

    function logout() {
      document.getElementById('appHeader').classList.add('hidden');
      document.getElementById('managerScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    }
  </script>
</body>
</html>
